<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Custom Colour AI</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
    min-height: 100vh;
}

header {
    text-align: center;
    padding: 18px 12px;
    background: #181818;
    border-bottom: 1px solid #333;
}

header h1 {
    font-size: 26px;
}

header p {
    color: #aaa;
    margin-top: 6px;
    font-size: 14px;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 15px;
}

.upload-area {
    text-align: center;
    padding: 15px;
}

.upload-btn {
    display: inline-block;
    background: #fff;
    color: #111;
    padding: 12px 20px;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
}

#imageInput {
    display: none;
}

.toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    justify-content: center;
    background: #1c1c1c;
    padding: 12px;
    border-radius: 12px;
    margin-bottom: 15px;
}

.tool-group {
    display: flex;
    align-items: center;
    gap: 7px;
}

button {
    border: none;
    background: #303030;
    color: white;
    padding: 9px 13px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
}

button:hover {
    background: #444;
}

button.active {
    background: white;
    color: black;
}

input[type="color"] {
    width: 45px;
    height: 38px;
    border: none;
    background: transparent;
    cursor: pointer;
}

input[type="range"] {
    width: 120px;
}

#canvasWrapper {
    width: 100%;
    min-height: 350px;
    background:
        linear-gradient(45deg, #222 25%, transparent 25%),
        linear-gradient(-45deg, #222 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #222 75%),
        linear-gradient(-45deg, transparent 75%, #222 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
    border: 1px solid #444;
    border-radius: 12px;
    overflow: hidden;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
}

#canvas {
    display: block;
    max-width: 100%;
    touch-action: none;
    cursor: crosshair;
}

.brush-cursor {
    position: fixed;
    width: 30px;
    height: 30px;
    border: 2px solid white;
    border-radius: 50%;
    pointer-events: none;
    display: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 0 1px black;
}

.info {
    text-align: center;
    color: #aaa;
    font-size: 13px;
    padding: 12px;
}

.status {
    text-align: center;
    margin-top: 10px;
    color: #aaa;
}

@media(max-width:600px) {
    header h1 {
        font-size: 22px;
    }

    .toolbar {
        gap: 7px;
    }

    button {
        padding: 8px 10px;
        font-size: 13px;
    }

    input[type="range"] {
        width: 90px;
    }
}
</style>
</head>

<body>

<header>
    <h1>🎨 Custom Colour AI</h1>
    <p>Upload an image and experiment with different colours</p>
</header>

<div class="container">

    <div class="upload-area">
        <label class="upload-btn">
            📷 Upload Image
            <input type="file" id="imageInput" accept="image/*">
        </label>
    </div>

    <div class="toolbar">

        <div class="tool-group">
            <span>Colour:</span>
            <input type="color" id="colorPicker" value="#ff0000">
        </div>

        <div class="tool-group">
            <span>Size:</span>
            <input type="range" id="brushSize" min="3" max="150" value="35">
            <span id="sizeValue">35</span>
        </div>

        <button id="brushBtn" class="active">🖌 Brush</button>
        <button id="eraserBtn">🧽 Eraser</button>

        <button id="undoBtn">↩ Undo</button>
        <button id="redoBtn">↪ Redo</button>

        <button id="zoomOut">−</button>
        <button id="zoomReset">100%</button>
        <button id="zoomIn">+</button>

        <button id="clearBtn">🗑 Clear</button>
        <button id="downloadBtn">⬇ Download</button>

    </div>

    <div id="canvasWrapper">
        <canvas id="canvas"></canvas>
    </div>

    <div class="info">
        Upload an image, choose any colour, then paint the area you want to recolour.
        <br>
        On mobile, drag your finger over the object.
    </div>

    <div class="status" id="status">
        No image selected
    </div>

</div>

<div class="brush-cursor" id="brushCursor"></div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const imageInput = document.getElementById("imageInput");
const colorPicker = document.getElementById("colorPicker");
const brushSize = document.getElementById("brushSize");
const sizeValue = document.getElementById("sizeValue");

const brushBtn = document.getElementById("brushBtn");
const eraserBtn = document.getElementById("eraserBtn");

const undoBtn = document.getElementById("undoBtn");
const redoBtn = document.getElementById("redoBtn");

const zoomIn = document.getElementById("zoomIn");
const zoomOut = document.getElementById("zoomOut");
const zoomReset = document.getElementById("zoomReset");

const clearBtn = document.getElementById("clearBtn");
const downloadBtn = document.getElementById("downloadBtn");

const status = document.getElementById("status");
const brushCursor = document.getElementById("brushCursor");

let image = new Image();

let drawing = false;
let tool = "brush";

let zoom = 1;

let undoStack = [];
let redoStack = [];

let originalImageData = null;

let lastX = 0;
let lastY = 0;


/* =========================
   IMAGE UPLOAD
========================= */

imageInput.addEventListener("change", function(e) {

    const file = e.target.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = function(event) {

        image.onload = function() {

            const maxWidth = 1000;
            const maxHeight = 750;

            let width = image.width;
            let height = image.height;

            const ratio = Math.min(
                maxWidth / width,
                maxHeight / height,
                1
            );

            width *= ratio;
            height *= ratio;

            canvas.width = width;
            canvas.height = height;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.drawImage(
                image,
                0,
                0,
                canvas.width,
                canvas.height
            );

            originalImageData =
                ctx.getImageData(
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );

            undoStack = [];
            redoStack = [];

            saveState();

            status.textContent =
                "Image loaded — choose a colour and start painting.";

        };

        image.src = event.target.result;
    };

    reader.readAsDataURL(file);

});


/* =========================
   BRUSH SIZE
========================= */

brushSize.addEventListener("input", function() {

    sizeValue.textContent = brushSize.value;

    updateCursor();

});


/* =========================
   TOOL SELECTION
========================= */

brushBtn.addEventListener("click", function() {

    tool = "brush";

    brushBtn.classList.add("active");
    eraserBtn.classList.remove("active");

});


eraserBtn.addEventListener("click", function() {

    tool = "eraser";

    eraserBtn.classList.add("active");
    brushBtn.classList.remove("active");

});


/* =========================
   COLOUR CONVERSION
========================= */

function hexToRgb(hex) {

    hex = hex.replace("#", "");

    return {
        r: parseInt(hex.substring(0,2),16),
        g: parseInt(hex.substring(2,4),16),
        b: parseInt(hex.substring(4,6),16)
    };

}


/* =========================
   DRAWING
========================= */

function getPosition(e) {

    const rect = canvas.getBoundingClientRect();

    let clientX;
    let clientY;

    if (e.touches && e.touches.length) {

        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;

    } else {

        clientX = e.clientX;
        clientY = e.clientY;

    }

    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;

    return {

        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY

    };

}


function startDrawing(e) {

    if (!image.src) return;

    e.preventDefault();

    drawing = true;

    const pos = getPosition(e);

    lastX = pos.x;
    lastY = pos.y;

    ctx.beginPath();
    ctx.moveTo(lastX, lastY);

}


function draw(e) {

    if (!drawing) return;

    e.preventDefault();

    const pos = getPosition(e);

    const color = hexToRgb(colorPicker.value);

    ctx.lineWidth = Number(brushSize.value);
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    if (tool === "brush") {

        ctx.globalCompositeOperation = "source-atop";

        ctx.strokeStyle =
            `rgb(${color.r}, ${color.g}, ${color.b})`;

    } else {

        ctx.globalCompositeOperation =
            "destination-out";

    }

    ctx.beginPath();

    ctx.moveTo(lastX, lastY);

    ctx.lineTo(pos.x, pos.y);

    ctx.stroke();

    lastX = pos.x;
    lastY = pos.y;

}


function stopDrawing() {

    if (!drawing) return;

    drawing = false;

    ctx.globalCompositeOperation =
        "source-over";

    saveState();

}


/* Mouse */

canvas.addEventListener("mousedown", startDrawing);
canvas.addEventListener("mousemove", draw);
canvas.addEventListener("mouseup", stopDrawing);
canvas.addEventListener("mouseleave", stopDrawing);


/* Touch */

canvas.addEventListener("touchstart", startDrawing, {
    passive: false
});

canvas.addEventListener("touchmove", draw, {
    passive: false
});

canvas.addEventListener("touchend", stopDrawing);


/* =========================
   BRUSH CURSOR
========================= */

function updateCursor() {

    const size = Number(brushSize.value);

    brushCursor.style.width = size + "px";
    brushCursor.style.height = size + "px";

}


canvas.addEventListener("mousemove", function(e) {

    brushCursor.style.display = "block";

    brushCursor.style.left = e.clientX + "px";
    brushCursor.style.top = e.clientY + "px";

    updateCursor();

});


canvas.addEventListener("mouseleave", function() {

    brushCursor.style.display = "none";

});


canvas.addEventListener("touchstart", function(e) {

    if (!e.touches.length) return;

    brushCursor.style.display = "block";

    brushCursor.style.left =
        e.touches[0].clientX + "px";

    brushCursor.style.top =
        e.touches[0].clientY + "px";

    updateCursor();

}, {passive:true});


canvas.addEventListener("touchmove", function(e) {

    if (!e.touches.length) return;

    brushCursor.style.display = "block";

    brushCursor.style.left =
        e.touches[0].clientX + "px";

    brushCursor.style.top =
        e.touches[0].clientY + "px";

}, {passive:true});


canvas.addEventListener("touchend", function() {

    brushCursor.style.display = "none";

});


/* =========================
   UNDO / REDO
========================= */

function saveState() {

    if (!canvas.width || !canvas.height) return;

    const state = ctx.getImageData(
        0,
        0,
        canvas.width,
        canvas.height
    );

    undoStack.push(state);

    if (undoStack.length > 30) {
        undoStack.shift();
    }

    redoStack = [];

}


undoBtn.addEventListener("click", function() {

    if (undoStack.length <= 1) return;

    const current =
        undoStack.pop();

    redoStack.push(current);

    const previous =
        undoStack[undoStack.length - 1];

    ctx.putImageData(previous, 0, 0);

});


redoBtn.addEventListener("click", function() {

    if (!redoStack.length) return;

    const next =
        redoStack.pop();

    undoStack.push(next);

    ctx.putImageData(next, 0, 0);

});


/* =========================
   ZOOM
========================= */

function updateZoom() {

    canvas.style.width =
        (canvas.width * zoom) + "px";

    canvas.style.height =
        (canvas.height * zoom) + "px";

    zoomReset.textContent =
        Math.round(zoom * 100) + "%";

}


zoomIn.addEventListener("click", function() {

    zoom += 0.25;

    if (zoom > 3) zoom = 3;

    updateZoom();

});


zoomOut.addEventListener("click", function() {

    zoom -= 0.25;

    if (zoom < 0.5) zoom = 0.5;

    updateZoom();

});


zoomReset.addEventListener("click", function() {

    zoom = 1;

    updateZoom();

});


/* =========================
   CLEAR
========================= */

clearBtn.addEventListener("click", function() {

    if (!originalImageData) return;

    if (!confirm("Reset the image?")) return;

    ctx.putImageData(
        originalImageData,
        0,
        0
    );

    saveState();

});


/* =========================
   DOWNLOAD
========================= */

downloadBtn.addEventListener("click", function() {

    if (!canvas.width) {

        alert("Please upload an image first.");

        return;

    }

    const link =
        document.createElement("a");

    link.download =
        "custom-colour-result.png";

    link.href =
        canvas.toDataURL("image/png");

    link.click();

});


/* =========================
   KEYBOARD SHORTCUTS
========================= */

document.addEventListener("keydown", function(e) {

    if ((e.ctrlKey || e.metaKey) && e.key === "z") {

        e.preventDefault();

        undoBtn.click();

    }

    if ((e.ctrlKey || e.metaKey) && e.key === "y") {

        e.preventDefault();

        redoBtn.click();

    }

});


</script>

</body>
</html>
