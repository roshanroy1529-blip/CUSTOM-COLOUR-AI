<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes">

<title>Custom Colour AI</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    min-height:100%;
    width:100%;
    background:#0b0d10;
    color:#f5f5f5;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    overflow-x:hidden;
}

button,
input{
    font:inherit;
}

button{
    border:0;
}

.header{
    padding:17px 12px;
    text-align:center;
    background:#111418;
    border-bottom:1px solid #292e35;
}

.logo{
    font-size:25px;
    font-weight:800;
}

.subtitle{
    margin-top:6px;
    color:#9ba3ad;
    font-size:13px;
}

.app{
    width:100%;
    max-width:1250px;
    margin:auto;
    padding:12px;
}

/* UPLOAD */

.upload-screen{
    min-height:70vh;
    display:flex;
    align-items:center;
    justify-content:center;
}

.upload-card{
    width:min(540px,100%);
    background:#15191e;
    border:1px solid #30363d;
    border-radius:20px;
    padding:40px 22px;
    text-align:center;
}

.upload-icon{
    font-size:60px;
    margin-bottom:15px;
}

.upload-card h1{
    font-size:24px;
    margin-bottom:9px;
}

.upload-card p{
    color:#9ba3ad;
    line-height:1.6;
    font-size:14px;
    margin-bottom:23px;
}

.upload-button{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    background:#fff;
    color:#111;
    padding:13px 23px;
    border-radius:11px;
    font-weight:700;
    cursor:pointer;
}

#imageInput{
    display:none;
}

/* EDITOR */

.editor{
    display:none;
}

/* TOP BAR */

.topbar{
    display:flex;
    gap:7px;
    overflow-x:auto;
    padding-bottom:10px;
    scrollbar-width:none;
}

.topbar::-webkit-scrollbar{
    display:none;
}

.action{
    flex:0 0 auto;
    padding:10px 13px;
    border-radius:9px;
    background:#1b2026;
    border:1px solid #30363d;
    color:#fff;
    cursor:pointer;
    white-space:nowrap;
}

.action:active{
    transform:scale(.97);
}

/* WORKSPACE */

.workspace{
    position:relative;
    width:100%;
    height:min(70vh,760px);
    min-height:350px;
    border:1px solid #30363d;
    border-radius:15px;
    overflow:hidden;

    background:
        linear-gradient(45deg,#181c21 25%,transparent 25%),
        linear-gradient(-45deg,#181c21 25%,transparent 25%),
        linear-gradient(45deg,transparent 75%,#181c21 75%),
        linear-gradient(-45deg,transparent 75%,#181c21 75%);

    background-size:24px 24px;
    background-position:0 0,0 12px,12px -12px,-12px 0;

    touch-action:none;
}

.viewport{
    position:absolute;
    inset:0;
    overflow:hidden;
    touch-action:none;
}

.stage{
    position:absolute;
    left:50%;
    top:50%;
    transform-origin:center center;
    will-change:transform;
}

canvas{
    display:block;
    max-width:none;
    user-select:none;
    -webkit-user-select:none;
    touch-action:none;
}

/* BRUSH POINTER */

.brush-cursor{
    position:fixed;
    z-index:99999;
    pointer-events:none;
    border:2px solid white;
    border-radius:50%;
    transform:translate(-50%,-50%);
    display:none;
    box-shadow:0 0 0 1px #111;
}

/* CONTROLS */

.panel{
    margin-top:10px;
    padding:13px;
    background:#15191e;
    border:1px solid #30363d;
    border-radius:14px;
}

.row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:11px;
}

.row:last-child{
    margin-bottom:0;
}

.label{
    width:72px;
    flex:0 0 72px;
    color:#9ba3ad;
    font-size:13px;
}

.color-box{
    width:48px;
    height:39px;
    padding:2px;
    border-radius:8px;
    border:1px solid #30363d;
    background:#20252b;
}

#colorPicker{
    width:100%;
    height:100%;
    border:0;
    padding:0;
    background:transparent;
    cursor:pointer;
}

.hex{
    font-size:13px;
    color:#ddd;
}

.range{
    flex:1;
    accent-color:#fff;
}

.number{
    width:45px;
    text-align:right;
    font-size:13px;
}

/* TOOLS */

.tools{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:7px;
}

.tool{
    min-height:44px;
    border-radius:9px;
    background:#1d2228;
    border:1px solid #30363d;
    color:#fff;
    cursor:pointer;
}

.tool.active{
    background:#fff;
    color:#111;
}

/* SECONDARY */

.secondary{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
    margin-top:8px;
}

.secondary button{
    min-height:42px;
    border-radius:9px;
    background:#1d2228;
    border:1px solid #30363d;
    color:white;
    cursor:pointer;
}

/* STATUS */

.status{
    text-align:center;
    color:#9ba3ad;
    font-size:12px;
    padding:9px 3px;
}

/* MOBILE */

@media(max-width:650px){

    .app{
        padding:8px;
    }

    .logo{
        font-size:22px;
    }

    .workspace{
        height:62vh;
        min-height:330px;
    }

    .tools{
        grid-template-columns:repeat(3,1fr);
    }

    .secondary{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:380px){

    .workspace{
        height:58vh;
    }

    .tools{
        grid-template-columns:repeat(2,1fr);
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="logo">🎨 Custom Colour AI</div>
    <div class="subtitle">
        Visualize colours before changing the real thing
    </div>
</header>

<main class="app">

<!-- UPLOAD -->

<section class="upload-screen" id="uploadScreen">

    <div class="upload-card">

        <div class="upload-icon">🖼️</div>

        <h1>Upload an image</h1>

        <p>
            Try different colours on bikes, cars, houses,
            furniture and other objects.
        </p>

        <label class="upload-button">
            📷 Choose Image
            <input id="imageInput"
                   type="file"
                   accept="image/*">
        </label>

    </div>

</section>


<!-- EDITOR -->

<section class="editor" id="editor">

    <div class="topbar">

        <button class="action" id="newImage">
            📷 New
        </button>

        <button class="action" id="undo">
            ↩ Undo
        </button>

        <button class="action" id="redo">
            ↪ Redo
        </button>

        <button class="action" id="reset">
            🔄 Reset
        </button>

        <button class="action" id="download">
            ⬇ Download
        </button>

    </div>


    <div class="workspace" id="workspace">

        <div class="viewport" id="viewport">

            <div class="stage" id="stage">

                <canvas id="canvas"></canvas>

            </div>

        </div>

    </div>


    <div class="panel">

        <div class="row">

            <div class="label">
                Colour
            </div>

            <div class="color-box">
                <input
                    id="colorPicker"
                    type="color"
                    value="#ff0000">
            </div>

            <span class="hex" id="hex">
                #FF0000
            </span>

        </div>


        <div class="row">

            <div class="label">
                Brush
            </div>

            <input
                class="range"
                id="brushSize"
                type="range"
                min="2"
                max="180"
                value="35">

            <span class="number" id="brushValue">
                35
            </span>

        </div>


        <div class="tools">

            <button class="tool active"
                    data-tool="brush">
                🖌 Brush
            </button>

            <button class="tool"
                    data-tool="eraser">
                🧽 Eraser
            </button>

            <button class="tool"
                    data-tool="circle">
                ⭕ Circle
            </button>

            <button class="tool"
                    data-tool="rectangle">
                ▭ Rectangle
            </button>

            <button class="tool"
                    data-tool="free">
                ✏️ Free Select
            </button>

        </div>


        <div class="secondary">

            <button id="desaturate">
                🧹 Remove Colour
            </button>

            <button id="applyColour">
                🎨 Apply Colour
            </button>

            <button id="clearMask">
                ✖ Clear Selection
            </button>

            <button id="fit">
                ⛶ Fit Image
            </button>

            <button id="zoomMinus">
                − Zoom
            </button>

            <button id="zoomPlus">
                + Zoom
            </button>

        </div>

    </div>


    <div class="status" id="status">
        Upload complete • pinch with two fingers to zoom
    </div>

</section>

</main>

<div class="brush-cursor" id="brushCursor"></div>


<script>

/* =====================================================
   ELEMENTS
===================================================== */

const imageInput =
    document.getElementById("imageInput");

const uploadScreen =
    document.getElementById("uploadScreen");

const editor =
    document.getElementById("editor");

const workspace =
    document.getElementById("workspace");

const viewport =
    document.getElementById("viewport");

const stage =
    document.getElementById("stage");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d", {
        willReadFrequently:true
    });

const colorPicker =
    document.getElementById("colorPicker");

const brushSize =
    document.getElementById("brushSize");

const brushValue =
    document.getElementById("brushValue");

const hex =
    document.getElementById("hex");

const status =
    document.getElementById("status");

const brushCursor =
    document.getElementById("brushCursor");


/* =====================================================
   STATE
===================================================== */

let image =
    new Image();

let originalPixels =
    null;

let originalCanvas =
    null;

let tool =
    "brush";

let drawing =
    false;

let selectionMode =
    false;

let zoom =
    1;

let panX =
    0;

let panY =
    0;

let lastX =
    0;

let lastY =
    0;

let shapeStart =
    null;

let temporaryImage =
    null;


/* =====================================================
   SELECTION MASK

   White = selected
   Black = not selected
===================================================== */

let maskCanvas =
    document.createElement("canvas");

let maskCtx =
    maskCanvas.getContext("2d");


/* =====================================================
   HISTORY

   We store both image and mask.
===================================================== */

let history =
    [];

let redoHistory =
    [];

const MAX_HISTORY =
    20;


/* =====================================================
   UPLOAD
===================================================== */

imageInput.addEventListener(
    "change",
    function(){

        const file =
            this.files[0];

        if(!file)
            return;

        const reader =
            new FileReader();

        reader.onload =
            function(e){

                image.onload =
                    function(){

                        initializeImage();

                    };

                image.src =
                    e.target.result;

            };

        reader.readAsDataURL(file);

    }
);


/* =====================================================
   INITIALIZE IMAGE
===================================================== */

function initializeImage(){

    const MAX_W =
        1600;

    const MAX_H =
        1100;

    let w =
        image.naturalWidth;

    let h =
        image.naturalHeight;

    const scale =
        Math.min(
            MAX_W / w,
            MAX_H / h,
            1
        );

    w =
        Math.round(
            w * scale
        );

    h =
        Math.round(
            h * scale
        );

    canvas.width =
        w;

    canvas.height =
        h;

    maskCanvas.width =
        w;

    maskCanvas.height =
        h;

    ctx.clearRect(
        0,
        0,
        w,
        h
    );

    ctx.drawImage(
        image,
        0,
        0,
        w,
        h
    );

    originalPixels =
        ctx.getImageData(
            0,
            0,
            w,
            h
        );

    originalCanvas =
        document.createElement(
            "canvas"
        );

    originalCanvas.width =
        w;

    originalCanvas.height =
        h;

    originalCanvas
        .getContext("2d")
        .putImageData(
            originalPixels,
            0,
            0
        );

    clearMask();

    history = [];
    redoHistory = [];

    saveState();

    uploadScreen.style.display =
        "none";

    editor.style.display =
        "block";

    fitImage();

    status.textContent =
        "Ready • choose Brush or a shape";

}


/* =====================================================
   FIT IMAGE
===================================================== */

function fitImage(){

    if(!canvas.width)
        return;

    const vw =
        viewport.clientWidth;

    const vh =
        viewport.clientHeight;

    const ratioX =
        vw / canvas.width;

    const ratioY =
        vh / canvas.height;

    zoom =
        Math.min(
            ratioX,
            ratioY,
            1
        );

    panX =
        0;

    panY =
        0;

    updateTransform();

}


/* =====================================================
   TRANSFORM
===================================================== */

function updateTransform(){

    stage.style.transform =
        `translate(calc(-50% + ${panX}px),calc(-50% + ${panY}px)) scale(${zoom})`;

}


/* =====================================================
   COLOUR
===================================================== */

colorPicker.addEventListener(
    "input",
    function(){

        hex.textContent =
            this.value.toUpperCase();

    }
);


/* =====================================================
   BRUSH SIZE
===================================================== */

brushSize.addEventListener(
    "input",
    function(){

        brushValue.textContent =
            this.value;

        updateCursor();

    }
);


/* =====================================================
   TOOL SELECTION
===================================================== */

document
    .querySelectorAll(".tool")
    .forEach(
        button => {

            button.addEventListener(
                "click",
                function(){

                    document
                        .querySelectorAll(".tool")
                        .forEach(
                            b =>
                                b.classList.remove(
                                    "active"
                                )
                        );

                    this.classList.add(
                        "active"
                    );

                    tool =
                        this.dataset.tool;

                    status.textContent =
                        tool === "brush"
                        ? "Brush selected"
                        : tool === "eraser"
                        ? "Eraser selected"
                        : tool === "circle"
                        ? "Circle selection"
                        : tool === "rectangle"
                        ? "Rectangle selection"
                        : "Free selection";

                }
            );

        }
    );


/* =====================================================
   CANVAS POSITION

   Converts screen coordinates to image
   coordinates while respecting zoom/pan.
===================================================== */

function imagePosition(e){

    const rect =
        canvas.getBoundingClientRect();

    return {

        x:
            (e.clientX - rect.left) *
            (canvas.width / rect.width),

        y:
            (e.clientY - rect.top) *
            (canvas.height / rect.height)

    };

}


/* =====================================================
   START POINTER
===================================================== */

function startPointer(e){

    if(activePointers.size > 1)
        return;

    const p =
        imagePosition(e);

    drawing =
        true;

    lastX =
        p.x;

    lastY =
        p.y;

    if(
        tool === "circle" ||
        tool === "rectangle" ||
        tool === "free"
    ){

        shapeStart =
            p;

        temporaryImage =
            ctx.getImageData(
                0,
                0,
                canvas.width,
                canvas.height
            );

    }

    if(tool === "brush"){

        paint(
            p.x,
            p.y
        );

    }

    if(tool === "eraser"){

        erase(
            p.x,
            p.y
        );

    }

}


/* =====================================================
   MOVE POINTER
===================================================== */

function movePointer(e){

    if(activePointers.size > 1)
        return;

    if(!drawing)
        return;

    const p =
        imagePosition(e);

    if(tool === "brush"){

        drawBrushLine(
            lastX,
            lastY,
            p.x,
            p.y
        );

    }

    else if(tool === "eraser"){

        eraseLine(
            lastX,
            lastY,
            p.x,
            p.y
        );

    }

    else if(
        tool === "circle" ||
        tool === "rectangle"
    ){

        previewShape(
            p
        );

    }

    else if(tool === "free"){

        drawFreeSelection(
            lastX,
            lastY,
            p.x,
            p.y
        );

    }

    lastX =
        p.x;

    lastY =
        p.y;

}


/* =====================================================
   END POINTER
===================================================== */

function endPointer(){

    if(!drawing)
        return;

    drawing =
        false;

    if(
        tool === "circle" ||
        tool === "rectangle"
    ){

        commitShape();

    }

    if(tool === "free"){

        saveState();

    }

    if(
        tool === "brush" ||
        tool === "eraser"
    ){

        saveState();

    }

    shapeStart =
        null;

    temporaryImage =
        null;

}


/* =====================================================
   BRUSH
===================================================== */

function paint(x,y){

    ctx.save();

    ctx.fillStyle =
        colorPicker.value;

    ctx.globalCompositeOperation =
        "source-over";

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        Number(brushSize.value) / 2,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.restore();

}


function drawBrushLine(
    x1,
    y1,
    x2,
    y2
){

    ctx.save();

    ctx.strokeStyle =
        colorPicker.value;

    ctx.lineWidth =
        Number(brushSize.value);

    ctx.lineCap =
        "round";

    ctx.lineJoin =
        "round";

    ctx.beginPath();

    ctx.moveTo(
        x1,
        y1
    );

    ctx.lineTo(
        x2,
        y2
    );

    ctx.stroke();

    ctx.restore();

}


/* =====================================================
   ERASER

   Restores original pixels instead of making
   the image transparent.
===================================================== */

function erase(x,y){

    restoreOriginalCircle(
        x,
        y,
        Number(brushSize.value) / 2
    );

}


function eraseLine(
    x1,
    y1,
    x2,
    y2
){

    const distance =
        Math.hypot(
            x2-x1,
            y2-y1
        );

    const steps =
        Math.max(
            1,
            Math.ceil(
                distance /
                (Number(brushSize.value) / 4)
            )
        );

    for(
        let i=0;
        i<=steps;
        i++
    ){

        const t =
